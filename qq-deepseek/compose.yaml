services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${WEBUI_TOKEN}
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
    networks:
      - botnet

  bot:
    build: ./bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DRIVER: "~fastapi+~httpx+~websockets"
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: INFO
      BOT_DB_PATH: /app/data/bot-memory.sqlite3
      ONEBOT_V11_ACCESS_TOKEN: ${BOT_ACCESS_TOKEN}
      ONEBOT_V11_WS_URLS: '["ws://napcat:3001"]'
    volumes:
      - ./stickers:/app/stickers
      - ./data/bot:/app/data
    depends_on:
      - napcat
    networks:
      - botnet

networks:
  botnet:
    name: qq-deepseek-botnet
